name: Sync Backend-Socket to Main Repo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deste repositório (Backend-Socket)
        uses: actions/checkout@v4
        with:
          path: source-repo

      - name: Checkout do Repositório Principal
        uses: actions/checkout@v4
        with:
          repository: cauagreccodev/pi4-2026-2-0102-grupo2
          token: ${{ secrets.API_TOKEN_GITHUB }}
          path: main-repo

      - name: Sincronizar pasta backend-socket
        run: |
          mkdir -p main-repo/backend-socket
          if [ -d "source-repo/backend-socket" ]; then
            SRC_DIR="source-repo/backend-socket/"
          else
            SRC_DIR="source-repo/"
          fi
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='docs/' \
            --exclude='README.md' \
            "$SRC_DIR" main-repo/backend-socket/

      - name: Commit e Push no Repositório Principal
        working-directory: main-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend-socket/
          if ! git diff --staged --quiet; then
            git commit -m "chore(backend-socket): sync code from backend-socket repo (${{ github.sha }})"
            git pull --rebase origin main
            git push
          fi
